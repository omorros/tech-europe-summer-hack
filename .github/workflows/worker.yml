name: walkthrough worker

# Tests run on every push and PR that touches the Worker. Deploy only happens
# on main, and only if the tests passed — a broken walkthrough renderer is
# worse than an old one during a demo.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Concurrency, not a matrix: two deploys racing to the same Worker would
    # be nondeterministic about which version ends up live.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      # Fail with an explanation rather than a wrangler stack trace, because
      # only a repo admin can add these and it will not be obvious otherwise.
      - name: Check deploy credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "A repo ADMIN must add them under Settings -> Secrets and variables -> Actions."
            echo "See worker/README.md for how to mint the Cloudflare token."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # FAL_KEY and WORKER_TOKEN are Worker secrets, set once with
      # `wrangler secret put` — they are NOT redeployed here and never appear
      # in this repo.
      - name: Smoke-test the deployment
        run: |
          url="${{ vars.WORKER_URL }}"
          if [ -z "$url" ]; then
            echo "::notice::Set the WORKER_URL repo variable to enable the health check."
            exit 0
          fi
          code=$(curl -s -o /tmp/health -w '%{http_code}' --max-time 20 "$url/health")
          echo "GET $url/health -> $code"
          cat /tmp/health
          [ "$code" = "200" ] || { echo "::error::health check failed"; exit 1; }
