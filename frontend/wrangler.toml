name = "sizeup-ui"
main = "worker.ts"
compatibility_date = "2026-08-22"

[assets]
directory = "./out"
binding = "ASSETS"
# next export writes 404.html. SPA handling would answer a mistyped URL with
# the address-entry page and a 200, which reads as a working screen.
not_found_handling = "404-page"
run_worker_first = ["/ws/*", "/incident", "/incident/*", "/health", "/static/*", "/cache/*", "/radio"]

[durable_objects]
bindings = [{ name = "INCIDENT", class_name = "IncidentHub" }]

[[migrations]]
tag = "v1-incident-hub"
new_sqlite_classes = ["IncidentHub"]

[vars]
# This Worker is the backend. FastAPI is not in the path.
PUBLIC_ORIGIN = "https://sizeup-ui.bill-nguyentonhoang.workers.dev"
WALKTHROUGH_URL = "https://sizeup-walkthrough.bill-nguyentonhoang.workers.dev"
BACKEND_ORIGIN = ""
